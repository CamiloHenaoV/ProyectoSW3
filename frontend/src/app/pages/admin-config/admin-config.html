<section class="pagina">
  <header class="page-header">
    <p class="eyebrow">Configuración</p>
    <h2>Agendamiento del equipo</h2>
  </header>

  <div class="selection-panel">
    <app-select-field
      placeholder="Médico/Terapista"
      [options]="opcionesMedicos"
      [value]="medicoId()"
      (valueChange)="onMedicoSeleccionado($event)"
    />
  </div>

  @if (medicoId()) {
    <app-formulario-configuracion
      [medicoId]="medicoId()"
      [configuracion]="configuracion()"
      (guardar)="guardar($event)"
    />
    @if (mensaje()) {
      <p class="mensaje">{{ mensaje() }}</p>
    }
  }
</section>
