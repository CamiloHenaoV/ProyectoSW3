<section class="pagina">
  <header class="page-header">
    <p class="eyebrow">Agendamiento</p>
    <h2>Reserva tu consulta</h2>
  </header>

  @if (mensaje()) {
    <p [class.error]="mensajeEsError()">{{ mensaje() }}</p>
  }

  <div class="selection-block">
    <h3>1. Elige médico/terapista, fecha y horario</h3>
    <div class="seleccion">
      <app-select-field
        placeholder="Médico/Terapista"
        [options]="opcionesMedicos"
        [value]="medicoId()"
        (valueChange)="medicoId.set($event)"
      />
      <app-input-field type="date" [value]="fecha()" (valueChange)="fecha.set($event)" />
      <app-button label="Ver franjas disponibles" (clicked)="buscarFranjas()" />
    </div>
  </div>

  <app-selector-franjas
    [franjas]="franjas()"
    [seleccionada]="franjaSeleccionada()"
    (seleccionar)="franjaSeleccionada.set($event)"
  />

  <app-button
    label="Confirmar cita"
    [disabled]="!franjaSeleccionada()"
    (clicked)="confirmarCita()"
  />

  @if (paso() === 3) {
    <div class="confirmacion">
      <h3>Tu cita ha sido agendada</h3>
    </div>
  }
</section>
