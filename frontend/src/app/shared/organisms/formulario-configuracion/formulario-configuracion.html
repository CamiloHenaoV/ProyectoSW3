<form class="form-config" novalidate (submit)="$event.preventDefault(); onSubmit()">
  <fieldset class="dias">
    <legend>Días de atención</legend>
    @for (dia of diasSemana; track dia.valor) {
      <label class="dia">
        <input
          type="checkbox"
          [checked]="diasSeleccionados().has(dia.valor)"
          (change)="toggleDia(dia.valor)"
        />
        {{ dia.nombre }}
      </label>
    }
  </fieldset>

  <div class="fila">
    <label class="campo">
      Hora de inicio
      <app-input-field type="time" [value]="horaInicio()" (valueChange)="horaInicio.set($event)" />
    </label>
    <label class="campo">
      Hora de fin
      <app-input-field type="time" [value]="horaFin()" (valueChange)="horaFin.set($event)" />
    </label>
  </div>

  <div class="fila">
    <label class="campo">
      Intervalo entre citas (minutos)
      <app-input-field type="number" [min]="5" [max]="240" [value]="intervaloMinutos()" (valueChange)="intervaloMinutos.set($event)" />
    </label>
    <label class="campo">
      Semanas habilitadas para agendar
      <app-input-field type="number" [min]="1" [max]="52" [value]="semanasHabilitadas()" (valueChange)="semanasHabilitadas.set($event)" />
    </label>
  </div>

  @if (errores().length) {
    <ul class="errores" role="alert">
      @for (error of errores(); track error) {
        <li>{{ error }}</li>
      }
    </ul>
  }

  <app-button label="Guardar configuración" type="submit" />
</form>
