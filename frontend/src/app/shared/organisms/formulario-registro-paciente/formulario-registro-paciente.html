<form class="form-registro" novalidate (submit)="$event.preventDefault(); onSubmit()">
  <app-form-field label="Nombre completo" [value]="nombre" [error]="errores().nombre ?? ''" (valueChange)="nombre = $event" [required]="true" />
  <app-form-field label="Cédula" [value]="documentoIdentidad" [error]="errores().documentoIdentidad ?? ''" (valueChange)="documentoIdentidad = $event" [required]="true" />
  <app-form-field label="Teléfono celular" type="tel" [value]="telefono" [error]="errores().telefono ?? ''" (valueChange)="telefono = $event" [required]="true" />
  <app-form-field label="Correo electrónico" type="email" [value]="email" [error]="errores().email ?? ''" (valueChange)="email = $event" [required]="true" />
  <app-form-field label="Contraseña" type="password" [value]="password" [error]="errores().password ?? ''" (valueChange)="password = $event" [required]="true" />
  <app-button [label]="enviando() ? 'Creando cuenta…' : 'Crear cuenta'" type="submit" [disabled]="enviando()" />
</form>
