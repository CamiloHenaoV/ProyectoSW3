@if (franjas().length) {
  @for (grupo of grupos(); track grupo.nombre) {
    <div class="grupo">
      <p class="grupo__nombre">{{ grupo.nombre }}</p>
      <div class="franjas" role="radiogroup" [attr.aria-label]="'Horarios de la ' + grupo.nombre.toLowerCase()">
        @for (franja of grupo.franjas; track franja.horaInicio) {
          <button
            type="button"
            role="radio"
            class="franja"
            [class.franja--seleccionada]="esSeleccionada(franja)"
            [attr.aria-checked]="esSeleccionada(franja)"
            (click)="seleccionar.emit(franja)"
          >
            {{ franja.horaInicio | hora }}
          </button>
        }
      </div>
    </div>
  }
} @else {
  <p class="vacio">{{ mensajeVacio() }}</p>
}
