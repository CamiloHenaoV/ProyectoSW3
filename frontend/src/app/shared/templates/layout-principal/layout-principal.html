<a class="saltar" href="#contenido">Saltar al contenido</a>

<header class="topbar">
  <div class="topbar__inner">
    <a class="brand" routerLink="/" aria-label="Piedrazul, inicio">
      <h1>Citas Médicas</h1>
      <span class="brand__sub">Piedrazul</span>
    </a>

    <nav class="topbar__nav" aria-label="Navegación principal">
      @if (autenticado()) {
        @for (enlace of enlaces(); track enlace.ruta) {
          <a [routerLink]="enlace.ruta" routerLinkActive="is-active">{{ enlace.etiqueta }}</a>
        }
      } @else {
        <a routerLink="/login" routerLinkActive="is-active">Iniciar sesión</a>
        <a routerLink="/registro" routerLinkActive="is-active">Crear cuenta</a>
      }
    </nav>

    @if (sesion(); as usuario) {
      <div class="usuario">
        <div class="usuario__datos">
          <strong>{{ usuario.nombre }}</strong>
          <span>{{ rolVisible() }}</span>
        </div>
        <button type="button" class="topbar__logout" (click)="cerrarSesion()">Cerrar sesión</button>
      </div>
    }
  </div>
</header>

<main class="contenido" id="contenido" tabindex="-1">
  <router-outlet />
</main>
