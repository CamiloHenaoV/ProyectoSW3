<div class="filtro">
  <label class="campo">
    <span>Médico o terapista</span>
    <app-select-field
      placeholder="Selecciona un profesional"
      [options]="opciones()"
      [value]="medicoId()"
      [disabled]="bloquearMedico()"
      (valueChange)="medicoIdChange.emit($event)"
    />
  </label>
  <label class="campo">
    <span>Fecha</span>
    <app-input-field type="date" [value]="fecha()" (valueChange)="fechaChange.emit($event)" />
  </label>
  <app-button label="Buscar citas" [disabled]="cargando()" (clicked)="buscar.emit()" />
</div>
