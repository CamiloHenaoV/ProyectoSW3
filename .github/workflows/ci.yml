name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run unit tests
        working-directory: frontend
        run: npm test -- --watch=false
      - name: Build production bundle
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore backend/CitasMedicas.Api.Tests/CitasMedicas.Api.Tests.csproj
      - name: Run tests
        run: dotnet test backend/CitasMedicas.Api.Tests/CitasMedicas.Api.Tests.csproj --no-restore --configuration Release
