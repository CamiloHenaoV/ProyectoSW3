services:
  - type: web
    name: piedrazul-keycloak
    runtime: docker
    rootDir: keycloak
    dockerfilePath: Dockerfile
    region: oregon
    plan: 0.5c-512mb
    healthCheckPath: /realms/master/.well-known/openid-configuration
    envVars:
      - key: KC_DB
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: piedrazul-keycloak-db
          property: connectionString
      - key: KC_HTTP_ENABLED
        value: "true"
      - key: KC_HTTP_PORT
        value: "10000"
      - key: KC_PROXY_HEADERS
        value: xforwarded
      - key: KC_BOOTSTRAP_ADMIN_USERNAME
        value: piedrazul-admin
      - key: KC_BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true
  - type: web
    name: piedrazul-api
    runtime: docker
    branch: main
    rootDir: backend/CitasMedicas.Api
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: MongoDbSettings__ConnectionString
        sync: false
      - key: MongoDbSettings__DatabaseName
        value: piedrazul_db
      - key: Keycloak__Authority
        sync: false
      - key: Keycloak__Audience
        value: piedrazul-api
      - key: Keycloak__Realm
        value: piedrazul
      - key: Keycloak__ServiceClientId
        value: piedrazul-api
      - key: Keycloak__ServiceClientSecret
        sync: false
      - key: Cors__AllowedOrigins__0
        sync: false

databases:
  - name: piedrazul-keycloak-db
    databaseName: keycloak
    user: keycloak
    postgresMajorVersion: "16"
    region: oregon
    plan: 0.1c-256mb
    ipAllowList: []
